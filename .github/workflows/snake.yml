name: Generate contribution snake

on: # List of events that trigger the workflow
  schedule:
    # Daily GitHub runs cron
    - cron: "7 22 * * *"
  workflow_dispatch: # lets you run it on demand from the Actions tab
  push: # Triggers the workflow on push events to this repository main branch
    branches: [main]

permissions: # Temporary read/write GITHUB_TOKEN permissions for the workflow to run
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest # Brand new virtual machine with the latest version of Ubuntu
    steps:
      - name: Draw the snake
        uses: Platane/snk@v3 # Third-party action that generates the contribution snake SVGs that lands in dist/
        with:
          github_user_name: ${{ github.repository_owner }} # Automatically resolve the repository owner username
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to the snake branch
        uses: crazy-max/ghaction-github-pages@v4 # Third-party action that pushes the generated snake SVGs to the snake branch
        with:
          target_branch: snake # Create snake branch if it doesn't exist, otherwise overwrite it
          build_dir: dist
          keep_history: false # Force-push a single orphan commit, so the branch never holds more than the latest SVGs
        env: # Environment variables for the script
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}